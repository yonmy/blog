{{ define "main" }}
<section class="intro">
  <h1>{{ .Site.Title }}</h1>
  <p>{{ .Site.Params.description }}</p>
</section>
{{ range .Site.RegularPages.GroupByDate "2006" }}
<section class="year">
  <h2>{{ .Key }}</h2>
  <ul class="post-list">
  {{ range .Pages }}
    <li><time>{{ .Date.Format "01.02" }}</time><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
  {{ end }}
  </ul>
</section>
{{ end }}
{{ end }}
